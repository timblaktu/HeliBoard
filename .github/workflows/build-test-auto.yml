name: Test build
# builds only for a single abi and does not produce an APK

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
    paths:
      - 'app/**'
  pull_request:
    paths:
      - 'app/src/main/java**'
  workflow_dispatch:

jobs:
  build:
    # Explicitly use x86_64 runners to ensure Robolectric native runtime compatibility
    # and match upstream architecture (see CI_RUNNER_ARCHITECTURE.md for details)
    # Using ubuntu-22.04 instead of ubuntu-20.04 (deprecated Feb 2025)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew testRunTestsUnitTest

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
